<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>kπ helix</title>
<style>:root{--bg:#04040d;--ink:#e8e3db;--gold:#c8a84a}html,body{margin:0;background:var(--bg);color:var(--ink);font:13px monospace;height:100%}
#w{display:flex;flex-direction:column;height:100%}canvas{flex:1;width:100%;touch-action:none;min-height:0}
#c{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;border-top:1px solid #222}
button{background:#0a0a18;color:var(--ink);border:1px solid #444;border-radius:5px;padding:3px 8px;font:inherit}button.on{border-color:var(--gold);color:var(--gold)}
b{color:var(--gold);font-weight:400}input[type=range]{width:130px}</style>
<div id=w><canvas id=cv></canvas><div id=c>
<span>k <b id=kv>2.00</b>π</span><input id=k type=range min=0.05 max=8 step=0.01 value=2>
<span>M ≤ <b id=mv>61</b></span><input id=m type=range min=2 max=61 value=61>
<button id=b1 class=on>coprime only</button><button id=b2 class=on>ring curves</button><button id=b3>flat (z = 0)</button>
<span style="opacity:.7">drag to turn · θ = kπ·r/M, height = θ/2π (turns), colour = sector ⌊M/r⌋</span></div></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d');let K=2,MM=61,rx=-0.5,rz=0.5,cop=true,crv=true,flat=false;
const g=(a,b)=>b?g(b,a%b):a,HUE=[0,50,170,215,275,320,25,110,190];
function sz(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;draw()}
function P(X,Y,Z,W,H){const c=Math.cos(rz),s=Math.sin(rz),a=X*c-Y*s,b=X*s+Y*c,cx=Math.cos(rx),sx=Math.sin(rx),y2=b*cx-Z*sx,z2=b*sx+Z*cx;const f=Math.min(W,H)*0.36;return[W/2+a*f,H/2-y2*f*0.0+ (-z2*f)*1+0,z2]}
function draw(){const W=cv.width,H=cv.height,d=devicePixelRatio||1;x.fillStyle='#04040d';x.fillRect(0,0,W,H);
const zs=flat?0:1,zmax=Math.max(0.3,K/2),zsc=1.3/zmax*zs;
const pr=(M,r)=>{const rho=M/61,th=K*Math.PI*r/M;return P(rho*Math.cos(th),rho*Math.sin(th),(th/(2*Math.PI))*zsc-0.65*zs,W,H)};
if(crv){x.lineWidth=d*0.6;for(let M=1;M<=MM;M++){x.strokeStyle='rgba(200,168,74,.16)';x.beginPath();for(let r=0;r<=M;r+=0.25){const p=pr(M,r);r?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])}x.stroke()}}
const pts=[];for(let M=1;M<=MM;M++)for(let r=1;r<=M;r++){const c=g(r,M)===1;if(cop&&!c)continue;const p=pr(M,r);pts.push([p[0],p[1],p[2],Math.min(8,Math.floor(M/r)),c])}
pts.sort((a,b)=>a[2]-b[2]);const rad=Math.max(1.2,Math.min(W,H)/420)*d;
pts.forEach(p=>{x.fillStyle=p[4]?'hsl('+HUE[p[3]]+',62%,58%)':'rgba(255,107,107,.5)';x.beginPath();x.arc(p[0],p[1],rad,0,7);x.fill()});
x.fillStyle='#e8e3db';x.font=13*d+'px monospace';x.fillText('M = 1 … '+MM+'   k = '+K.toFixed(2)+'π   '+pts.length+' points',12*d,20*d)}
const $=i=>document.getElementById(i);
$('k').oninput=e=>{K=+e.target.value;$('kv').textContent=K.toFixed(2);draw()};$('m').oninput=e=>{MM=+e.target.value;$('mv').textContent=MM;draw()};
$('b1').onclick=e=>{cop=!cop;e.target.classList.toggle('on',cop);draw()};$('b2').onclick=e=>{crv=!crv;e.target.classList.toggle('on',crv);draw()};$('b3').onclick=e=>{flat=!flat;e.target.classList.toggle('on',flat);draw()};
let dn=null;cv.onpointerdown=e=>{dn=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointerup=()=>dn=null;
cv.onpointermove=e=>{if(!dn)return;rz+=(e.clientX-dn[0])*0.008;rx=Math.max(-2.6,Math.min(0.2,rx+(e.clientY-dn[1])*0.008));dn=[e.clientX,e.clientY];draw()};
window.addEventListener('resize',sz);sz();
</script>
